<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 840" fill="none">
  <rect width="1200" height="840" fill="#F7F3EC"/>
  <!-- Outer drafting border -->
  <rect x="32" y="32" width="1136" height="776" stroke="#181715" stroke-width="1.2"/>
  <rect x="40" y="40" width="1120" height="760" stroke="#181715" stroke-opacity="0.25" stroke-width="0.75"/>

  <!-- Subtle architectural grid -->
  <g stroke="#181715" stroke-opacity="0.06" stroke-width="1">
    <line x1="200" y1="40" x2="200" y2="700"/>
    <line x1="400" y1="40" x2="400" y2="700"/>
    <line x1="600" y1="40" x2="600" y2="700"/>
    <line x1="800" y1="40" x2="800" y2="700"/>
    <line x1="1000" y1="40" x2="1000" y2="700"/>
    <line x1="40" y1="200" x2="1160" y2="200"/>
    <line x1="40" y1="360" x2="1160" y2="360"/>
    <line x1="40" y1="520" x2="1160" y2="520"/>
  </g>

  <!-- Private Loggia Terrace (Top) -->
  <rect x="140" y="96" width="920" height="128" fill="#EAE3D7" stroke="#181715" stroke-width="1.5" stroke-dasharray="6 4"/>
  <!-- Terrace paving lines -->
  <g stroke="#181715" stroke-opacity="0.14" stroke-width="0.75">
    <line x1="255" y1="96" x2="255" y2="224"/>
    <line x1="370" y1="96" x2="370" y2="224"/>
    <line x1="485" y1="96" x2="485" y2="224"/>
    <line x1="600" y1="96" x2="600" y2="224"/>
    <line x1="715" y1="96" x2="715" y2="224"/>
    <line x1="830" y1="96" x2="830" y2="224"/>
    <line x1="945" y1="96" x2="945" y2="224"/>
  </g>
  <text x="600" y="154" text-anchor="middle" font-family="Georgia, serif" font-size="16" letter-spacing="3" fill="#181715">PRIVATE CANTILEVERED LOGGIA</text>
  <text x="600" y="176" text-anchor="middle" font-family="sans-serif" font-size="11" letter-spacing="1.5" fill="#4E4A44">14.2m × 3.1m  |  HONED TRAVERTINE</text>

  <!-- Structural Walls -->
  <rect x="140" y="224" width="920" height="416" fill="#FAF7F2" stroke="#181715" stroke-width="5"/>

  <!-- Glazing Breaks along North / Terrace Elevation -->
  <line x1="210" y1="224" x2="520" y2="224" stroke="#8C6D46" stroke-width="6"/>
  <line x1="590" y1="224" x2="990" y2="224" stroke="#8C6D46" stroke-width="6"/>

  <!-- Interior Partition Walls -->
  <!-- Primary Suite Left (x: 140..440, y: 224..640) -->
  <line x1="440" y1="224" x2="440" y2="530" stroke="#181715" stroke-width="3.5"/>
  <line x1="440" y1="578" x2="440" y2="640" stroke="#181715" stroke-width="3.5"/>
  <!-- Door arc -->
  <path d="M440 530 A48 48 0 0 1 488 578 L440 578" stroke="#181715" stroke-width="1" fill="none"/>
  <!-- Primary Bath & Dressing divider -->
  <line x1="140" y1="450" x2="365" y2="450" stroke="#181715" stroke-width="2.5"/>
  <line x1="285" y1="450" x2="285" y2="640" stroke="#181715" stroke-width="2.5"/>

  <!-- Living / Dining Salon Center (x: 440..810, y: 224..640) -->
  <line x1="810" y1="224" x2="810" y2="495" stroke="#181715" stroke-width="3.5"/>
  <line x1="810" y1="545" x2="810" y2="640" stroke="#181715" stroke-width="3.5"/>
  <path d="M810 495 A50 50 0 0 0 760 545 L810 545" stroke="#181715" stroke-width="1" fill="none"/>

  <!-- Kitchen Island & Millwork -->
  <rect x="495" y="470" width="240" height="58" fill="#EAE3D7" stroke="#181715" stroke-width="1.5"/>
  <rect x="475" y="592" width="280" height="44" fill="#DDD4C5" stroke="#181715" stroke-width="1.2"/>

  <!-- Guest Bedroom 02 Right (x: 810..1060, y: 224..640) -->
  <line x1="810" y1="455" x2="1060" y2="455" stroke="#181715" stroke-width="2.5"/>
  <!-- Powder / Entry Gallery -->
  <line x1="440" y1="545" x2="475" y2="545" stroke="#181715" stroke-width="2"/>

  <!-- Structural Columns -->
  <g fill="#181715">
    <rect x="136" y="220" width="12" height="12"/>
    <rect x="434" y="220" width="12" height="12"/>
    <rect x="804" y="220" width="12" height="12"/>
    <rect x="1052" y="220" width="12" height="12"/>
    <rect x="136" y="632" width="12" height="12"/>
    <rect x="434" y="632" width="12" height="12"/>
    <rect x="804" y="632" width="12" height="12"/>
    <rect x="1052" y="632" width="12" height="12"/>
  </g>

  <!-- Room Furniture Outlines (Architectural CAD style) -->
  <!-- Primary Bed -->
  <rect x="175" y="280" width="145" height="130" stroke="#4E4A44" stroke-width="1.2" fill="#F4EFE6"/>
  <rect x="188" y="288" width="52" height="24" stroke="#4E4A44" stroke-width="0.9"/>
  <rect x="254" y="288" width="52" height="24" stroke="#4E4A44" stroke-width="0.9"/>
  <!-- Freestanding Stone Tub -->
  <rect x="165" y="480" width="90" height="44" rx="22" stroke="#4E4A44" stroke-width="1.2" fill="#F4EFE6"/>
  <!-- Salon Seating -->
  <rect x="505" y="278" width="220" height="72" stroke="#4E4A44" stroke-width="1.2" fill="#F4EFE6"/>
  <rect x="545" y="366" width="140" height="52" stroke="#4E4A44" stroke-width="1"/>
  <!-- Bedroom 2 Bed -->
  <rect x="865" y="280" width="135" height="125" stroke="#4E4A44" stroke-width="1.2" fill="#F4EFE6"/>

  <!-- Room Labels -->
  <g font-family="Georgia, serif" fill="#181715" text-anchor="middle">
    <text x="295" y="355" font-size="15" letter-spacing="2">PRIMARY SUITE</text>
    <text x="215" y="568" font-size="13" letter-spacing="1.5">EN-SUITE BATH</text>
    <text x="362" y="545" font-size="12" letter-spacing="1.5">DRESSING</text>
    <text x="625" y="320" font-size="16" letter-spacing="2.5">GREAT SALON &amp; DINING</text>
    <text x="615" y="504" font-size="13" letter-spacing="2">ATELIER KITCHEN</text>
    <text x="935" y="352" font-size="15" letter-spacing="2">SUITE 02</text>
    <text x="935" y="550" font-size="13" letter-spacing="1.5">BATH 02 &amp; FOYER</text>
  </g>
  <g font-family="sans-serif" font-size="11" fill="#787268" text-anchor="middle" letter-spacing="1">
    <text x="295" y="375">5.4m × 4.8m</text>
    <text x="625" y="340">8.2m × 6.4m</text>
    <text x="935" y="372">4.6m × 4.4m</text>
  </g>

  <!-- Title Block Footer -->
  <line x1="40" y1="712" x2="1160" y2="712" stroke="#181715" stroke-width="1.2"/>
  <line x1="360" y1="712" x2="360" y2="800" stroke="#181715" stroke-width="0.9"/>
  <line x1="760" y1="712" x2="760" y2="800" stroke="#181715" stroke-width="0.9"/>
  <line x1="1020" y1="712" x2="1020" y2="800" stroke="#181715" stroke-width="0.9"/>

  <text x="68" y="750" font-family="Georgia, serif" font-size="18" letter-spacing="3" fill="#181715">AURELIA DEVELOPMENTS</text>
  <text x="68" y="774" font-family="sans-serif" font-size="11" letter-spacing="2" fill="#787268">ARCHITECTURAL PLATE — TYPE A LOGGIA</text>

  <text x="390" y="748" font-family="Georgia, serif" font-size="16" letter-spacing="2" fill="#181715">TWO-BEDROOM LOGGIA RESIDENCE</text>
  <text x="390" y="774" font-family="sans-serif" font-size="11" letter-spacing="1.5" fill="#4E4A44">INTERNAL: 1,680 SQ FT  |  EXTERIOR: 470 SQ FT  |  TOTAL: 2,150 SQ FT</text>

  <text x="790" y="748" font-family="sans-serif" font-size="11" letter-spacing="2" fill="#787268">SCALE BAR (METRIC)</text>
  <rect x="790" y="762" width="160" height="8" stroke="#181715" stroke-width="1" fill="none"/>
  <rect x="790" y="762" width="40" height="8" fill="#181715"/>
  <rect x="870" y="762" width="40" height="8" fill="#181715"/>
  <text x="790" y="786" font-family="sans-serif" font-size="9" fill="#4E4A44">0m          2m          4m          6m</text>

  <!-- Compass North -->
  <circle cx="1090" cy="756" r="22" stroke="#181715" stroke-width="1"/>
  <path d="M1090 736 L1096 760 L1090 754 L1084 760 Z" fill="#8C6D46"/>
  <text x="1090" y="792" text-anchor="middle" font-family="sans-serif" font-size="10" letter-spacing="2" fill="#181715">NORTH</text>
</svg>
